name: Test Shadow Bearings
on:
  push:
    branches: [main, 'design/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run tests
        run: npm test
      - name: Benchmark AI gameplay across seeded games
        run: SIM_GAMES=40 npm run simulate
      - name: Verify script syntax
        run: |
          node --check src/app.mjs
          node --check src/engine.mjs
          node --check src/map.mjs
          node --check src/geometry.mjs
          node --check src/ai.mjs
          node --check src/deduction.mjs
          node --check src/tutorial.mjs
          node --check scripts/simulate.mjs
          node --check src/scenarios.mjs
          node --check src/scenery.mjs
          node --check src/blackfen.mjs
          node --check src/waterways.mjs
          node --check src/monsters.mjs
          node --check src/monster-powers.mjs
          node --check src/hunter-guide.mjs
          node --check src/hunter-forge.mjs
          node --check src/hunt-replay.mjs
          node --check src/persistence.mjs
          node --check src/protractor.mjs
          node --check scripts/package-site.mjs
