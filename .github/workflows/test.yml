name: Test Shadow Bearings
on:
  push:
    branches: [main, 'design/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run tests
        run: npm test
      - name: Verify script syntax
        run: |
          node --check src/app.mjs
          node --check src/engine.mjs
          node --check src/map.mjs
          node --check src/geometry.mjs
