name: Build reviewable Shadow Bearings preview

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test gameplay and UI
        run: |
          npm test
          npm run check
      - name: Build static site
        run: npm run build:site
      - name: Upload portable playable preview
        uses: actions/upload-artifact@v4
        with:
          name: shadow-bearings-site-preview
          path: _site/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error
